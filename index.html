<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CORY</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="CORY">
<meta name="theme-color" content="#F6EDE4">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout : colonne mobile unique (max 520px), barre d'onglets fixe en bas, séance en plein écran par-dessus. */
:root{
  --bg:#F6EDE4; --surface:#FFF8F1; --surface-2:#EFDFD2; --line:#E4D0C1;
  --fg:#3B261D; --muted:#7A5E51; --accent:#B5523B; --accent-ink:#FFFFFF;
  --accent-soft:#F1D9CC; --peach:#C9A895; --ok:#47704B; --warn:#9A5F0E;
  --display:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:18px; --tabh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C130F; --surface:#281B15; --surface-2:#34241D; --line:#46312A;
  --fg:#F6EDE4; --muted:#C9A895; --accent:#DF7258; --accent-ink:#1C130F;
  --accent-soft:#4A2A20; --peach:#8E6D5C; --ok:#8DBB8F; --warn:#E3A857; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C130F; --surface:#281B15; --surface-2:#34241D; --line:#46312A;
  --fg:#F6EDE4; --muted:#C9A895; --accent:#DF7258; --accent-ink:#1C130F;
  --accent-soft:#4A2A20; --peach:#8E6D5C; --ok:#8DBB8F; --warn:#E3A857; color-scheme:dark}
.th-argile{--accent:#8E3B2A;--accent-soft:#EBCFC5}
.th-sauge{--accent:#55704F;--accent-soft:#DCE5D6}
.th-ocre{--accent:#94600F;--accent-soft:#F0DFC2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .th-argile{--accent:#E8876F;--accent-soft:#4A2620}
 :root:not([data-theme="light"]) .th-sauge{--accent:#9DBC94;--accent-soft:#2C3A29}
 :root:not([data-theme="light"]) .th-ocre{--accent:#E2AC55;--accent-soft:#43321A}}
:root[data-theme="dark"] .th-argile{--accent:#E8876F;--accent-soft:#4A2620}
:root[data-theme="dark"] .th-sauge{--accent:#9DBC94;--accent-soft:#2C3A29}
:root[data-theme="dark"] .th-ocre{--accent:#E2AC55;--accent-soft:#43321A}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:16px/1.45 var(--body);-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:520px;margin:0 auto;padding-block:12px calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px))}
#app.noTabs{padding-bottom:32px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.1;font-weight:700}
h2{font-size:21px;line-height:1.2;font-weight:700}
h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.eyebrow{font:700 12px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}

/* Barre du haut */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:8px;font:800 22px/1 var(--display);letter-spacing:.08em;color:var(--fg)}
.brand svg{width:30px;height:30px;color:var(--fg)}
.logo{color:var(--fg)}
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s}
#splash svg{width:120px;height:120px}
#splash .w{font:800 40px/1 var(--display);letter-spacing:.1em;color:var(--fg)}
#splash.out{opacity:0;pointer-events:none}
#splash svg{animation:spin 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes spin{from{transform:rotate(-90deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
.coach img{transition:opacity .35s}
.coach img.fade{opacity:0}
.faces{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.faces div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;text-align:center}
.faces img{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.faces .off img{filter:grayscale(1) blur(2px);opacity:.45}
.faces .off{color:var(--muted)}
.coachline{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border-radius:16px;padding:8px 12px 8px 8px;font-weight:600;font-size:15px}
.lvlChip{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 11px 5px 6px;font:600 13px var(--display)}
.lvlChip b{background:var(--accent);color:var(--accent-ink);border-radius:99px;min-width:24px;height:24px;display:grid;place-items:center;font-size:12px}

/* Cartes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:transparent;border-style:dashed}
.coach{display:flex;gap:14px;align-items:flex-end;background:linear-gradient(140deg,var(--accent-soft),var(--surface));border:1px solid var(--line);border-radius:22px;padding:16px 16px 0 16px;overflow:hidden}
.coach .say{flex:1;min-width:0;padding-bottom:16px}
.coach .say p{font-size:17px;line-height:1.35;font-weight:600}
.coach img{width:112px;height:112px;object-fit:cover;border-radius:16px 16px 0 0;flex-shrink:0;display:block}
.face{width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.face.lg{width:96px;height:96px}
.face.xl{width:150px;height:150px}

/* Boutons */
button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border:0;border-radius:14px;padding:12px 18px;
  background:var(--accent);color:var(--accent-ink);font:700 16px var(--display);cursor:pointer;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;border-radius:12px}
.btn.danger{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:700;cursor:pointer;min-height:44px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 14px;min-height:44px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .rank{font-size:11px;background:var(--accent-ink);color:var(--accent);border-radius:99px;width:18px;height:18px;display:inline-grid;place-items:center}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.alt{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;font-weight:600;font-size:14px;cursor:pointer;min-height:48px}
.choice{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.choice b{font-family:var(--display);font-size:17px;display:block}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:99px;padding:3px 9px;font-size:12.5px;font-weight:700;color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.ok{color:var(--ok)}

/* Séance du jour */
.today h2{font-size:23px}
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exlist li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.exlist li:first-child{border-top:0}
.idx{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font:700 14px var(--display);flex-shrink:0}
.idx.main{background:var(--accent-soft);color:var(--accent)}

/* Arc */
.arcWrap{display:flex;align-items:center;gap:16px}
.arc{width:96px;height:96px;flex-shrink:0}
.arc .trk{stroke:var(--surface-2)}
.arc .fill{stroke:var(--accent);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.arc .c{stroke:var(--fg)}
.arc .seg{stroke:var(--surface-2)}
.arc .seg.on{stroke:var(--peach)}
.arc text{fill:var(--fg);font:700 26px var(--display)}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
.reduce *{transition:none!important;animation:none!important}

/* Défis */
.chal{display:flex;gap:12px;align-items:center}
.chal .ring{width:42px;height:42px;flex-shrink:0}
.chal .ring circle{fill:none;stroke-width:5}

/* Semaine */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted)}
.day .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line);font-size:13px;color:var(--muted)}
.day.plan .dot{border:1.5px solid var(--accent);color:var(--accent)}
.day.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.today{background:var(--surface)}
.day.today span{color:var(--fg)}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:52px;font:600 12px var(--display);color:var(--muted);cursor:pointer}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* Lecteur de séance */
.player{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.player .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.pbar{display:flex;gap:4px}
.pbar i{flex:1;height:5px;border-radius:9px;background:var(--surface-2)}
.pbar i.on{background:var(--accent)}
.pbar i.cur{background:var(--peach)}
.sets{display:flex;flex-direction:column;gap:8px}
.kg{display:grid;grid-template-columns:30px 1fr 30px;gap:3px;align-items:center}
.kg button{height:40px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;font:800 18px var(--display);cursor:pointer;padding:0}
.set{display:grid;grid-template-columns:30px .8fr 1.5fr 50px;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.set.done{background:var(--accent-soft);border-color:transparent}
.set label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.06em}
.set input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px;font:700 18px var(--display);text-align:center}
.set .n{font:700 15px var(--display);text-align:center;color:var(--muted)}
.check{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.check svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2.6}
.set.done .check{background:var(--accent);border-color:var(--accent)}
.set.done .check svg{stroke:var(--accent-ink)}
.cues{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.rest{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 94%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.rest .clock{width:210px;height:210px}
.rest .clock circle{fill:none;stroke-width:12}
.rest .t{font:800 54px var(--display);fill:var(--fg)}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(30,18,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.rpe{width:100%;accent-color:var(--accent)}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace}
input[type=text],input[type=number]{font:inherit}
.field{display:flex;flex-direction:column;gap:6px}
.field input{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px;font-size:17px;min-height:48px;width:100%}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--accent);width:20px}

/* Progrès */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font:800 24px var(--display)}
.heat{display:grid;grid-template-columns:auto repeat(7,minmax(0,26px));gap:5px;align-items:center;justify-content:start}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--surface-2);max-width:100%}
.heat i.l1{background:var(--peach)}
.heat i.l2{background:var(--accent)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px;font-weight:600;padding:12px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.badge svg{width:44px;height:44px}
.badge.off{opacity:.45}
.season{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.season div{display:flex;flex-direction:column;gap:5px;align-items:center;font-size:11.5px;color:var(--muted);text-align:center}
.season i{width:100%;height:8px;border-radius:9px;background:var(--surface-2)}
.season .on i{background:var(--accent)}
.season .on{color:var(--fg);font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:9px 0;border-top:1px solid var(--line)}
.tbl td:last-child{text-align:right}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.sw{width:52px;height:32px;border-radius:99px;background:var(--surface-2);border:0;position:relative;cursor:pointer;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{left:23px}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.theme{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;cursor:pointer}
.theme i{width:28px;height:28px;border-radius:50%}
.theme[aria-pressed="true"]{border-color:var(--fg)}
.theme:disabled{opacity:.5;cursor:not-allowed}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90vw;text-align:center}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.center{text-align:center;align-items:center}
.hero-ob{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-top:8px}
.hero-ob img{width:220px;height:300px;object-fit:cover;object-position:top;border-radius:120px 120px 24px 24px}
.note{font-size:13px;color:var(--muted);background:var(--surface);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.fig{width:100%;height:auto;display:block}
.fig .limb,.fig .torso{stroke:var(--fg);stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .far{stroke:var(--peach)}
.fig .head{fill:var(--fg)}
.fig .floor{stroke:var(--line);stroke-width:2}
.fig .eq{fill:var(--peach)}
.fig .eqs{stroke:var(--peach);stroke-width:4;fill:none}
.fig .cab{stroke:var(--accent);stroke-width:1.6;stroke-dasharray:3 3;fill:none}
.fig .load{fill:var(--accent)}
.tuto{background:var(--surface-2);border-radius:var(--r);padding:6px;position:relative}
.tuto > .fig{height:210px;width:auto;max-width:100%;margin:0 auto}
.tuto .two .fig{height:150px;width:auto;max-width:100%;margin:0 auto}
.tuto .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tuto .cap{position:absolute;left:12px;top:10px;font:700 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tuto .two div{position:relative;background:var(--surface);border-radius:12px}
.thumb{width:48px;height:42px;flex-shrink:0;background:var(--surface-2);border-radius:10px;overflow:hidden}
.thumb.main{box-shadow:inset 0 0 0 2px var(--accent)}
.rowbtn{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit}
.chrono{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font:800 22px var(--display);cursor:pointer;width:100%}
.chrono.run{background:var(--surface-2);color:var(--fg)}
.set .chr{grid-column:2 / 4;min-height:44px;font-size:17px}
.breath{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-top:10px}
.bwrap{width:240px;height:240px;display:grid;place-items:center;position:relative}
.bcirc{width:240px;height:240px;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--accent-soft),var(--peach));transform:scale(.45);will-change:transform}
.bring{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--line)}
.blabel{position:absolute;inset:0;display:grid;place-items:center;font:800 26px var(--display);color:var(--fg)}

/* ---------- Mini tutoriels animés : silhouette articulée ---------- */
const FIG = (function(){
  const L = {T:50, U:29, F:27, H:41, S:40, head:9.5};
  const FLOOR = 186;
  const rad = d => d*Math.PI/180;
  const go = (p, len, ang) => ({x: p.x + len*Math.sin(rad(ang)), y: p.y + len*Math.cos(rad(ang))});
  const lerp = (a,b,k) => a + (b-a)*k;
  // Poses : angles absolus en degrés (0 = vers le bas, 90 = vers l'avant/droite, 180 = vers le haut, -90 = vers l'arrière).
  const base = {hx:120, hy:110, t:0, a:0, f:0, th:0, sh:0, toe:0, g:1};
  function solve(P){
    const p = Object.assign({}, base, P);
    ["a","f","th","sh"].forEach(k=>{ if (p[k+"2"]==null) p[k+"2"]=p[k]; });
    const hip = {x:p.hx, y:p.hy};
    const neck = {x: hip.x + L.T*Math.sin(rad(p.t)), y: hip.y - L.T*Math.cos(rad(p.t))};
    const sho = {x: lerp(hip.x,neck.x,.9), y: lerp(hip.y,neck.y,.9)};
    const head = {x: neck.x + 13*Math.sin(rad(p.t)), y: neck.y - 13*Math.cos(rad(p.t))};
    const el1 = go(sho,L.U,p.a), ha1 = go(el1,L.F,p.f), el2 = go(sho,L.U,p.a2), ha2 = go(el2,L.F,p.f2);
    const kn1 = go(hip,L.H,p.th), an1 = go(kn1,L.S,p.sh), kn2 = go(hip,L.H,p.th2), an2 = go(kn2,L.S,p.sh2);
    let dy = 0;
    if (p.g) dy = FLOOR - 4 - Math.max(an1.y, an2.y) - (p.lift||0);
    const pts = {hip,neck,sho,head,el1,ha1,el2,ha2,kn1,an1,kn2,an2};
    for (const k in pts) pts[k] = {x:pts[k].x, y:pts[k].y+dy};
    pts.toe1 = go(pts.an1, 12, 90 + (p.toe||0) + (p.sh>60||p.sh<-60 ? 0 : 0) - 0);
    pts.toe2 = go(pts.an2, 12, 90 + (p.toe2!=null?p.toe2:p.toe||0));
    if (p.sh > 45 || p.sh < -45 || (p.footRel)) { pts.toe1 = go(pts.an1, 12, p.sh + 90 + (p.footRel||0)); }
    if (p.sh2 > 45 || p.sh2 < -45 || (p.footRel)) { pts.toe2 = go(pts.an2, 12, p.sh2 + 90 + (p.footRel||0)); }
    return pts;
  }
  function seg(a,b,cls){ return '<line class="'+cls+'" x1="'+a.x.toFixed(1)+'" y1="'+a.y.toFixed(1)+'" x2="'+b.x.toFixed(1)+'" y2="'+b.y.toFixed(1)+'"/>'; }
  function propsSVG(props, q){
    let s = "";
    (props||[]).forEach(pr=>{
      const [k, ...v] = pr;
      if (k==="bench") s += '<rect class="eq" x="'+v[0]+'" y="'+v[1]+'" width="'+v[2]+'" height="8" rx="3"/><line class="eqs" x1="'+(v[0]+8)+'" y1="'+(v[1]+8)+'" x2="'+(v[0]+8)+'" y2="'+FLOOR+'"/><line class="eqs" x1="'+(v[0]+v[2]-8)+'" y1="'+(v[1]+8)+'" x2="'+(v[0]+v[2]-8)+'" y2="'+FLOOR+'"/>';
      if (k==="back") s += '<line class="eqs" x1="'+v[0]+'" y1="'+v[1]+'" x2="'+v[2]+'" y2="'+v[3]+'" style="stroke-width:8"/>';
      if (k==="post") s += '<line class="eqs" x1="'+v[0]+'" y1="'+v[1]+'" x2="'+v[0]+'" y2="'+FLOOR+'" style="stroke-width:6"/>';
      if (k==="cable"){ const h = q[v[2]||"ha1"]; s += '<line class="cab" x1="'+v[0]+'" y1="'+v[1]+'" x2="'+h.x.toFixed(1)+'" y2="'+h.y.toFixed(1)+'"/><circle class="eq" cx="'+v[0]+'" cy="'+v[1]+'" r="5"/>'; }
      if (k==="wheel") s += '<circle class="eqs" cx="'+v[0]+'" cy="'+v[1]+'" r="'+v[2]+'" fill="none"/>';
      if (k==="pad"){ const h=q[v[0]]; s += '<circle class="eq" cx="'+h.x.toFixed(1)+'" cy="'+h.y.toFixed(1)+'" r="'+(v[1]||6)+'"/>'; }
      if (k==="plate"){ const a=q.an1, b=q.toe1; const ang=Math.atan2(b.y-a.y,b.x-a.x); const cx=(a.x+b.x)/2+Math.cos(ang)*4, cy=(a.y+b.y)/2+Math.sin(ang)*4; const nx=-Math.sin(ang)*0, len=20; s += '<line class="eqs" style="stroke-width:7" x1="'+(cx+Math.cos(ang+Math.PI/2)*len).toFixed(1)+'" y1="'+(cy+Math.sin(ang+Math.PI/2)*len).toFixed(1)+'" x2="'+(cx-Math.cos(ang+Math.PI/2)*len).toFixed(1)+'" y2="'+(cy-Math.sin(ang+Math.PI/2)*len).toFixed(1)+'"/>'; }
    });
    return s;
  }
  function handSVG(kind, q){
    if (!kind) return "";
    const h = q.ha1;
    if (kind==="db") return '<rect class="load" x="'+(h.x-9).toFixed(1)+'" y="'+(h.y-4).toFixed(1)+'" width="18" height="8" rx="3"/>';
    if (kind==="bar") return '<circle class="load" cx="'+h.x.toFixed(1)+'" cy="'+h.y.toFixed(1)+'" r="10"/><circle class="eq" cx="'+h.x.toFixed(1)+'" cy="'+h.y.toFixed(1)+'" r="3"/>';
    if (kind==="hipbar") return '<circle class="load" cx="'+q.hip.x.toFixed(1)+'" cy="'+(q.hip.y-12).toFixed(1)+'" r="10"/>';
    if (kind==="handle") return '<line class="eqs" x1="'+(h.x).toFixed(1)+'" y1="'+(h.y-8).toFixed(1)+'" x2="'+h.x.toFixed(1)+'" y2="'+(h.y+8).toFixed(1)+'" style="stroke-width:5"/>';
    return "";
  }
  function sideSVG(P, A){
    const q = solve(P);
    const far = seg(q.hip,q.kn2,"limb far")+seg(q.kn2,q.an2,"limb far")+seg(q.an2,q.toe2,"limb far foot")+seg(q.sho,q.el2,"limb far")+seg(q.el2,q.ha2,"limb far");
    const near = seg(q.hip,q.kn1,"limb")+seg(q.kn1,q.an1,"limb")+seg(q.an1,q.toe1,"limb foot")+seg(q.sho,q.el1,"limb")+seg(q.el1,q.ha1,"limb");
    const torso = seg(q.hip,q.neck,"torso");
    const head = '<circle class="head" cx="'+q.head.x.toFixed(1)+'" cy="'+q.head.y.toFixed(1)+'" r="'+L.head+'"/>';
    return propsSVG(A.props, q) + far + torso + head + near + handSVG(A.load, q);
  }
  function frontSVG(P, A){
    const p = Object.assign({a:10, f:0, l:6, seat:0, len:1, sq:0}, P);
    const cx = 120, hipY = p.seat ? 132 : 110 + p.sq, shY = hipY - 52, shW = 20, hipW = 11;
    let s = "";
    if (p.seat) s += '<rect class="eq" x="'+(cx-34)+'" y="'+(hipY+6)+'" width="68" height="8" rx="3"/><line class="eqs" x1="'+cx+'" y1="'+(hipY+14)+'" x2="'+cx+'" y2="'+FLOOR+'"/>';
    // jambes
    [-1,1].forEach(sd=>{
      const hp = {x:cx+sd*hipW, y:hipY};
      if (p.seat){ const kn = {x: hp.x + sd*Math.sin(rad(p.l))*24, y: hp.y + 6}; const an = {x: kn.x, y: kn.y+42}; s += seg(hp,kn,"limb")+seg(kn,an,"limb")+seg(an,{x:an.x+sd*4,y:an.y},"limb foot");
        if (A.props && A.props.some(x=>x[0]==="kneepad")) s += '<circle class="eq" cx="'+(kn.x+sd*7).toFixed(1)+'" cy="'+(kn.y+8).toFixed(1)+'" r="5"/>'; }
      else { const kn = go(hp, L.H, sd*p.l); const an = go(kn, L.S, sd*p.l*0.6); const dy = FLOOR-4-an.y; s += seg({x:hp.x,y:hp.y+dy*0},{x:kn.x,y:kn.y},"limb")+seg(kn,an,"limb")+seg(an,{x:an.x+sd*7,y:an.y},"limb foot"); }
    });
    s += '<path class="torso" d="M'+(cx-hipW)+' '+hipY+' L'+(cx-shW+3)+' '+shY+' L'+(cx+shW-3)+' '+shY+' L'+(cx+hipW)+' '+hipY+'" fill="none"/>';
    s += '<circle class="head" cx="'+cx+'" cy="'+(shY-17)+'" r="'+L.head+'"/>';
    [-1,1].forEach(sd=>{
      const sh = {x:cx+sd*shW, y:shY+3};
      const el = {x: sh.x + sd*Math.sin(rad(p.a))*L.U*p.len, y: sh.y + Math.cos(rad(p.a))*L.U};
      const fa = p.a + p.f;
      const ha = {x: el.x + sd*Math.sin(rad(fa))*L.F*p.len, y: el.y + Math.cos(rad(fa))*L.F};
      s += seg(sh,el,"limb")+seg(el,ha,"limb");
      if (A.load==="db") s += '<rect class="load" x="'+(ha.x-4).toFixed(1)+'" y="'+(ha.y-8).toFixed(1)+'" width="8" height="16" rx="3"/>';
      if (A.load==="cable") s += '<line class="cab" x1="'+(cx+sd*70)+'" y1="'+(A.cy||40)+'" x2="'+ha.x.toFixed(1)+'" y2="'+ha.y.toFixed(1)+'"/><circle class="eq" cx="'+(cx+sd*70)+'" cy="'+(A.cy||40)+'" r="5"/>';
    });
    return s;
  }
  function frame(A, k){
    const a = A.A, b = A.B, P = {};
    for (const key in Object.assign({}, a, b)){
      const va = a[key] != null ? a[key] : (b[key]);
      const vb = b[key] != null ? b[key] : va;
      P[key] = (typeof va === "number") ? lerp(va, vb, k) : va;
    }
    return (A.v==="front" ? frontSVG : sideSVG)(P, A);
  }
  function svg(A, k, label){
    return '<svg class="fig" viewBox="20 18 200 176" role="img" aria-label="'+(label||"")+'"><line class="floor" x1="20" y1="'+FLOOR+'" x2="220" y2="'+FLOOR+'"/><g class="figg">'+frame(A,k)+'</g></svg>';
  }
  return {svg, frame};
})();

const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");

const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };

/* ---------- État et sauvegarde ---------- */
const KEY = "cory.v1";
function blank(){ return {v:1,updatedAt:0,profile:null,program:null,logs:[],xp:[],lastByEx:{},postponed:{},swaps:{},badges:{},seenLevel:1,active:null,settings:{game:true,reduce:false,theme:"terra"}}; }
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch(e) {}
let remote = null, syncState = "local", saveTimer = null;
function save(now){
  S.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushRemote, now?50:1200);
}
let pushing = false, pushAgain = false;
async function pushRemote(){
  if (!remote) return;
  if (pushing) { pushAgain = true; return; }
  pushing = true;
  try { await remote.set({json: JSON.stringify(S), updatedAt: S.updatedAt}); syncState = "cloud"; }
  catch(e){ syncState = "local"; }
  pushing = false;
  if (pushAgain) { pushAgain = false; pushRemote(); }
}
async function initRemote(){
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const ref = db.doc("data/users/"+id+"/state");
    const snap = await ref.get();
    remote = ref;
    if (snap.exists) {
      const d = snap.data();
      if (d && d.json && (d.updatedAt||0) > (S.updatedAt||0)) {
        S = Object.assign(blank(), JSON.parse(d.json));
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {}
        syncState = "cloud"; render(); return;
      }
    }
    syncState = "cloud";
    if (S.profile) pushRemote();
    if (view.tab==="profil") render();
  } catch(e) { remote = null; }
}

const LEVEL_NAMES = [[1,"Éveil"],[3,"Rythme"],[6,"Élan"],[10,"Ancrage"],[15,"Maîtrise"],[20,"Légende"]];
const xpFor = n => 50*n*(n-1); // seuil cumulé du niveau n
const totalXP = () => S.xp.reduce((a,x)=>a+x.amount,0);
function levelOf(xp){ let n=1; while (xp >= xpFor(n+1)) n++; return n; }
function paletteName(n){ let r=LEVEL_NAMES[0][1]; for (const [l,name] of LEVEL_NAMES) if (n>=l) r=name; return r; }
function award(event, amount, label, training){
  if (S.xp.some(x=>x.event===event)) return 0;
  if (training) {
    const today = todayKey();
    const used = S.xp.filter(x=>x.date===today && x.training).reduce((a,x)=>a+x.amount,0);
    amount = Math.max(0, Math.min(amount, 220-used));
  }
  if (!amount) return 0;
  S.xp.push({event,amount,label,date:todayKey(),training:!!training});
  return amount;
}

function checkBadges(){
  const got=[]; const give=id=>{ if(!S.badges[id]){ S.badges[id]=todayKey(); got.push(id);} };
  const done = S.logs.filter(l=>l.completed && l.type!=="MOB" && l.type!=="STR");
  if (done.length>=1) give("first");
  if (done.length>=10) give("ten");
  if (S.logs.filter(l=>l.rpe).length>=5) give("listen5");
  if (S.logs.some(l=>l.type==="MOB"||l.type==="STR")) give("recup");
  const exs = new Set(); S.logs.forEach(l=>l.items.forEach(it=>{ if(it.sets.some(s=>s.done)) exs.add(it.ex); }));
  if (exs.size>=12) give("explore");
  if (S.xp.some(x=>x.event.startsWith("week-"))) give("week3");
  const wk = S.xp.filter(x=>x.event.startsWith("week-")).map(x=>x.event.slice(5)).sort();
  for (let i=1;i<wk.length;i++) if (dk(addDays(parseDk(wk[i-1]),7))===wk[i]) give("streak2");
  if (Object.values(S.lastByEx).some(v=>v.raised)) give("up");
  if ((S.breaths||[]).length>=5) give("zen");
  if (levelOf(totalXP())>=5) give("lvl5");
  return got;
}

/* ---------- Moteur de programme ---------- */
function weekIndex(){ if(!S.program) return 0; return Math.max(0, Math.floor((monday(new Date()) - monday(parseDk(S.program.start)))/(7*864e5))); }
function blockWeek(){ return weekIndex()%4 + 1; }
function goal(){ return (S.profile.goals[0]) || "forme"; }
function candidates(group){
  const p = S.profile, have = new Set(p.equipment);
  return LIB.filter(e => e.g===group && e.e.every(q=>have.has(q)) && e.l <= p.level && !e.x.some(x=>p.limits.includes(x)))
    .sort((a,b)=> (p.level===1 ? (b.e.includes("machines")-a.e.includes("machines")) : 0) || (b.l - a.l)*(p.level>=2?1:-1));
}
function pickFor(group, variant, used){
  let c = candidates(group).filter(e=>!used.has(e.id));
  if (!c.length) return null;
  const sw = S.swaps[group];
  if (sw && c.some(e=>e.id===sw)) return EX[sw];
  return c[variant % Math.min(c.length,2)];
}
function dosage(isMain, ex){
  const g = goal(), lvl = S.profile.level;
  let sets=3, lo=10, hi=12, rest=75;
  if (g==="force"){ if(isMain){ sets=4; lo=5; hi=6; rest=120; } else { lo=8; hi=10; rest=90; } }
  else if (g==="muscle"){ sets = isMain?4:3; lo=8; hi=12; rest=90; }
  else if (g==="endurance"){ lo=12; hi=15; rest=45; }
  else if (g==="mobilite"){ sets=2; lo=12; hi=12; rest=60; }
  if (lvl===1){ if (g==="force") { lo=8; hi=10; } sets=Math.max(2, sets-1); }
  if (blockWeek()===4) sets = Math.max(2, sets-1);
  if (ex.s){ return {sets: ex.g==="cardio"?1:Math.max(2,sets-1), lo: ex.g==="cardio"? (S.profile.goals.includes("endurance")?600:420) : (lvl===1?25:lvl===2?35:45), hi:0, rest: ex.g==="cardio"?0:45, unit:"sec"}; }
  return {sets, lo, hi, rest, unit:"reps"};
}
function buildSession(type, opts){
  opts = opts||{};
  if (type==="MOB") return {type, title:TEMPLATES.MOB.t, focus:TEMPLATES.MOB.f, warm:"Installe-toi au calme sur un tapis.", items: MOBILITY.map(m=>({ex:m.id, sets:2, lo:45, hi:0, rest:15, unit:"sec", main:false, phase:"main"})), notes:[]};
  if (type==="STR") return {type, title:TEMPLATES.STR.t, focus:TEMPLATES.STR.f, warm:"Installe un tapis. Étire-toi sans douleur, en respirant lentement.", items: STRETCH.map(m=>({ex:m.id, sets:1, lo:60, hi:0, rest:0, unit:"sec", main:false, phase:"main"})).concat([{ex:"m1",sets:1,lo:60,hi:0,rest:0,unit:"sec",main:false,phase:"main"}]), notes:[]};
  const T = TEMPLATES[type], p = S.profile;
  const minutes = opts.short ? 25 : p.minutes;
  let slots = T.s.slice();
  const notes = [];
  // zone prioritaire : un bloc en plus, placé tôt, sans retirer l'équilibre
  const zone = p.zones.find(z=>z!=="global");
  if (zone){
    const g = (ZONE_GROUPS[zone]||[]).find(g=>!slots.includes(g)) || null;
    if (g) slots.splice(2,0,g);
  }
  const maxEx = clamp(Math.floor((minutes-12)/7), 3, 8);
  const wantCardio = p.goals.includes("endurance") && p.equipment.length;
  if (slots.length > maxEx - (wantCardio?1:0)) slots = slots.slice(0, maxEx - (wantCardio?1:0));
  if (wantCardio) slots.push("cardio");
  const used = new Set(); const items = [];
  const variant = Math.floor(weekIndex()/2) + (opts.occurrence||0);
  slots.forEach((g,i)=>{
    const isMain = i<2 && g!=="core" && g!=="cardio";
    const ex = pickFor(g, isMain? (opts.occurrence||0) : variant, used);
    if (!ex){ notes.push("Aucun exercice « "+GROUP_LABEL[g]+" » compatible avec ton matériel et tes précautions : je l'ai retiré."); return; }
    used.add(ex.id);
    const d = dosage(isMain, ex);
    if (opts.tired && d.sets>2) d.sets -= 1;
    items.push(Object.assign({ex:ex.id, main:isMain, phase:"main"}, d));
  });
  const upper = ["UP","PUSH","PULL"].includes(type), lower = ["LO","LEGS"].includes(type);
  const warmIds = upper ? ["w5","w1","w6","w3","w7"] : lower ? ["w5","w2","w3","w4","w7"] : ["w5","w1","w2","w3","w4"];
  const coolIds = upper ? ["s3","s6","s4","s2"] : lower ? ["s1","s2","s5","s7"] : ["s1","s3","s5","s4"];
  const warm = (opts.short ? warmIds.slice(0,3) : warmIds).map(id=>({ex:id, sets:1, lo:35, hi:0, rest:0, unit:"sec", main:false, phase:"warm"}));
  const cool = (opts.short ? coolIds.slice(0,2) : coolIds).map(id=>({ex:id, sets:1, lo:40, hi:0, rest:0, unit:"sec", main:false, phase:"cool"})).concat([{ex:"m1", sets:1, lo:60, hi:0, rest:0, unit:"sec", main:false, phase:"cool"}]);
  items.unshift(...warm); items.push(...cool);
  return {type, title:T.t, focus:T.f, warm: p.level===1 ? "Échauffement guidé, puis 1 série légère du premier exercice." : "Échauffement guidé, puis 2 séries de montée en charge sur le premier exercice.", items, notes};
}
function cycle(){ return CYCLES[clamp(S.profile.days.length,2,5)]; }
function weekLogs(wk){ wk = wk||weekKey(); return S.logs.filter(l=>weekKey(parseDk(l.date))===wk && l.type!=="MOB" && l.type!=="STR" && l.items.some(it=>it.sets.some(s=>s.done))); }
function nextSessionType(){ const c = cycle(); const n = weekLogs().length; return {type:c[n % c.length], occurrence: (c.slice(0, n % c.length).filter(t=>t===c[n % c.length]).length)}; }
function todayStatus(){
  const now = new Date(), t = todayKey(), dow = now.getDay();
  const doneToday = S.logs.find(l=>l.date===t && l.completed && l.type!=="MOB" && l.type!=="STR");
  const goalN = S.profile.days.length, n = weekLogs().length;
  if (doneToday) return {kind:"done", log:doneToday};
  if (n >= goalN) return {kind:"weekdone"};
  const planned = S.profile.days.includes(dow) && !S.postponed[t];
  return {kind: planned ? "session" : "rest"};
}
function nextPlannedDay(){
  for (let i=1;i<8;i++){ const d=addDays(new Date(),i); if (S.profile.days.includes(d.getDay())) return d; }
  return null;
}

/* ---------- Coach : messages selon le contexte ---------- */
function hello(){ const h=new Date().getHours(); return h<6?"Bonsoir":h<18?"Salut":"Bonsoir"; }
function coachHome(st){
  const name = S.profile.name ? " "+S.profile.name : "";
  const last = S.logs.filter(l=>l.completed).slice(-1)[0];
  if (S.active) return {face:"motivate", text:"Ta séance est en pause. On la reprend là où tu t'étais arrêtée ?"};
  if (st.kind==="done") return {face:"farewell", text:"Séance faite aujourd'hui, bravo"+name+". Récupère bien, à demain !"};
  if (st.kind==="weekdone") return {face:"congratulate", text:"Objectif de la semaine atteint"+name+" ! La récupération fait aussi partie du programme."};
  if (st.kind==="rest"){
    const nd = nextPlannedDay();
    return {face:"rest", text:"Aujourd'hui, c'est repos"+name+". "+(nd?"Prochaine séance "+DAYS_LONG[nd.getDay()]+".":"")+" Une petite mobilité si tu en as envie ?"};
  }
  if (last && last.pain) return {face:"listen", text:"La dernière fois, tu m'as signalé une gêne. Rien n'augmente aujourd'hui : écoute ton corps et dis-moi comment ça va."};
  if (last && last.rpe>=9) return {face:"listen", text:"Ta dernière séance était très difficile. J'ai gardé les mêmes charges pour aujourd'hui."};
  if (blockWeek()===4) return {face:"focus", text:hello()+name+" ! Semaine allégée : un peu moins de séries pour bien assimiler le travail du bloc."};
  return {face:"welcome", text:hello()+name+" ! Tu as "+S.profile.minutes+" minutes aujourd'hui ? Je t'ai préparé ta séance."};
}

function arcSVG(pct, label, size){
  // Arc évolutif : le C extérieur se remplit, les 3 segments s'allument à 25/50/75 %.
  pct = clamp(pct,0,100);
  const r=40, C=2*Math.PI*r*0.78, off=C*(1-pct/100);
  const seg=(a,on)=>'<path class="seg'+(on?" on":"")+'" d="'+a+'" stroke-width="7" fill="none" stroke-linecap="round"/>';
  return '<svg class="arc" viewBox="0 0 100 100" role="img" aria-label="'+esc(label)+' : '+Math.round(pct)+' %"'+(size?' style="width:'+size+'px;height:'+size+'px"':'')+'>'
   +'<circle class="trk" cx="50" cy="50" r="'+r+'" fill="none" stroke-width="9" stroke-dasharray="'+C+' 999" transform="rotate(62 50 50)" stroke-linecap="round"/>'
   +'<circle class="fill" cx="50" cy="50" r="'+r+'" fill="none" stroke-width="9" stroke-dasharray="'+C+' 999" stroke-dashoffset="'+off+'" transform="rotate(62 50 50)" stroke-linecap="round"/>'
   +seg("M 74 14 A 44 44 0 0 1 84 24",pct>=25)+seg("M 88 31 A 44 44 0 0 1 93 43",pct>=50)+seg("M 94 51 A 44 44 0 0 1 92 62",pct>=75)
   +'<text x="50" y="59" text-anchor="middle">'+esc(label)+'</text></svg>';
}

function thumb(id, main){ const A = ANIMS[EX_ANIM[id]]; return '<span class="thumb'+(main?" main":"")+'">'+(A?FIG.svg(A,1,""):"")+'</span>'; }

function tutoHTML(id){

function animLoop(ts){
  const els = document.querySelectorAll("[data-anim]");
  if (els.length){
    const cyc = 3200, x = (ts % cyc)/cyc; let k;
    if (x<.38) k = x/.38; else if (x<.5) k = 1; else if (x<.88) k = 1-(x-.5)/.38; else k = 0;
    k = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    els.forEach(el=>{ const g = el.querySelector(".figg"); const A = ANIMS[el.dataset.anim]; if (g && A) g.innerHTML = FIG.frame(A,k); });
  }
  requestAnimationFrame(animLoop);
}
requestAnimationFrame(animLoop);
function estMinutes(s){ return Math.round(2 + s.items.reduce((a,it)=> a + (it.unit==="sec" ? it.sets*(it.lo+it.rest)/60 : it.sets*(0.8+it.rest/60)), 0)); }

function challenges(){
  const wl = weekLogs(), goalN = S.profile.days.length;
  const fb = S.logs.filter(l=>weekKey(parseDk(l.date))===weekKey() && l.rpe).length;
  const before = new Set(); S.logs.filter(l=>weekKey(parseDk(l.date))!==weekKey()).forEach(l=>l.items.forEach(it=>{ if(it.sets.some(s=>s.done)) before.add(it.ex); }));
  const newEx = new Set(); wl.forEach(l=>l.items.forEach(it=>{ if(it.sets.some(s=>s.done) && !before.has(it.ex)) newEx.add(it.ex); }));
  const mob = S.logs.some(l=>(l.type==="MOB"||l.type==="STR") && weekKey(parseDk(l.date))===weekKey());
  const list = [{id:"week",t:goalN+" séances cette semaine",p:wl.length,of:goalN,xp:80},{id:"fb",t:"Remplir 2 retours de séance",p:fb,of:2,xp:30}];
  const br = (S.breaths||[]).filter(b=>weekKey(parseDk(b.date))===weekKey()).length;
  const third = [{id:"new",t:"Découvrir un nouvel exercice",p:newEx.size,of:1,xp:30},{id:"mob",t:"Prendre 15 min pour la mobilité ou les étirements",p:mob?1:0,of:1,xp:30},{id:"br",t:"Faire 2 séances de respiration",p:br,of:2,xp:30}];
  list.push(third[weekIndex()%3]);
  return list;
}
function settleChallenges(){
  let gained = 0; const wk = weekKey();
  challenges().forEach(c=>{ if (c.p>=c.of) gained += award(c.id==="week"?"week-"+wk:"ch-"+c.id+"-"+wk, c.xp, "Défi : "+c.t, false); });
  return gained;
}

/* ---------- Lecteur de séance ---------- */
function startSession(type, occ, mode){
  if (S.active && !confirmReplace()) return;
  const s = buildSession(type, {occurrence:+occ||0, short:mode==="short", tired:mode==="tired"});
  S.active = {id:uid(), date:todayKey(), started:Date.now(), type, title:s.title + (mode==="short"?" (express)":mode==="tired"?" (allégée)":""), warm:s.warm, step:-1, mode:mode||"",
    items: s.items.map(it=>{ const last=S.lastByEx[it.ex]; const reps = it.unit==="sec"? it.lo : (last && last.reps ? clamp(last.reps, it.lo, it.hi||it.lo) : (it.hi||it.lo));
      const w = last && last.next!=null ? last.next : (last&&last.weight!=null?last.weight:"");
      return Object.assign({}, it, {sets: Array.from({length:it.sets},()=>({reps, weight: EX[it.ex].w ? w : "", done:false}))}); }),
    energy:null, painStart:false};
  save(); openPlayer();
}

function sessionFace(a, it){
  const mains = a.items.filter(x=>!x.phase || x.phase==="main"), idx = mains.indexOf(it), doneN = it.sets.filter(s=>s.done).length;
  if (a.painStart) return {face:"listen", text:"Va doucement. Si ça tire, on remplace l'exercice."};
  if (doneN===it.sets.length) return {face:"congratulate", text:"Exercice bouclé, bien joué !"};
  if (idx===mains.length-1 && doneN>=it.sets.length-1) return {face:"motivate", text:"Dernière série de la séance, tu y es presque !"};
  if (doneN>=it.sets.length-1 && it.sets.length>1) return {face:"effort", text:"Dernière série : garde une technique propre jusqu'au bout."};
  if (doneN===0 && idx===0) return {face:"focus", text:"Exercice repère : installe-toi bien avant la première série."};
  if (idx>=Math.ceil(mains.length/2) && doneN===0) return {face:"motivate", text:"Plus que "+(mains.length-idx)+" exercice"+(mains.length-idx>1?"s":"")+", on garde le rythme."};
  return {face: it.main?"focus":"demonstrate", text: it.main?"Concentre-toi sur la descente contrôlée.":"Regarde la démo puis lance ta série."};

/* Chrono des exercices en secondes */
let chronoTimer = null;
function startChrono(k){
  const a = S.active, it = a.items[a.step];
  if (view.chrono && view.chrono.step===a.step && view.chrono.k===k){ stopChrono(); renderLayer(); return; }
  stopChrono();
  view.chrono = {step:a.step, k, end: Date.now()+it.lo*1000};
  renderLayer();
  chronoTimer = setInterval(()=>{
    const c = view.chrono; if (!c) return;
    const left = Math.max(0, Math.ceil((c.end-Date.now())/1000));
    const el = $("#chr"+c.k); if (el) el.textContent = Math.floor(left/60)+":"+pad(left%60)+" · arrêter";

    +(B.id==="b3"?'<p class="tiny muted">Si la tête te tourne, reprends une respiration normale.</p>':'')+'</div></div></div>';

function breathTick(){
  const b = view.breath; if (!b || !b.start) return;
  const B = BREATH.find(x=>x.id===b.id), cycle = B.ph.reduce((x,p)=>x+p[1],0);
  const el = (Date.now()-b.start)/1000, total = cycle*B.cycles;
  if (el >= total){ b.done = true; b.start = 0; finishBreath(B); renderLayer(); return; }
  let t = el % cycle, i = 0; while (t >= B.ph[i][1]) { t -= B.ph[i][1]; i++; }
  const [name, dur] = B.ph[i], k = t/dur;
  let prevScale = 1; // échelle selon la phase
  const lastBig = (()=>{ let big = .45; for (let j=0;j<i;j++){ if (B.ph[j][0]==="Inspire") big=1; if (B.ph[j][0]==="Expire") big=.45; } return big; })();
  const sc = name==="Inspire" ? .45+.55*k : name==="Expire" ? 1-.55*k : lastBig;
  const c = $("#bcirc"); if (c && !S.settings.reduce) c.style.transform = "scale("+sc.toFixed(3)+")";
  const l = $("#blabel"); if (l) l.textContent = name+" · "+Math.ceil(dur-t);
  const sub = $("#bsub"); if (sub) sub.textContent = "Cycle "+(Math.floor(el/cycle)+1)+" sur "+B.cycles;
  breathRAF = requestAnimationFrame(breathTick);
}

function finishSession(){
  const a = S.active; if (!a) return;
  const already = S.logs.find(l=>l.id===a.id); if (already) { S.active=null; save(true); return; } // idempotent
  const rpe = a.rpe||7, pain = a.painEnd===true || a.painStart;
  const M = a.items.filter(it=>!it.phase || it.phase==="main");
  const allDone = M.every(it=>it.sets.every(s=>s.done));
  const anyDone = M.some(it=>it.sets.some(s=>s.done));
  const notes = [];
  M.forEach(it=>{
    const e = EX[it.ex], done = it.sets.filter(s=>s.done); if (!done.length || e.g==="mob" || e.g==="stretch") return;
    const reps = Math.round(done.reduce((x,s)=>x+(+s.reps||0),0)/done.length);
    const w = e.w ? Math.max(...done.map(s=>+s.weight||0)) : null;
    const prev = S.lastByEx[it.ex] || {};
    const rec = {date:a.date, reps, weight:w, best: Math.max(prev.best||0, w||0) || null, next: w, raised: prev.raised||false};
    const hitAll = it.sets.every(s=>s.done && (+s.reps||0) >= (it.unit==="sec"?it.lo:it.lo));
    if (pain) { rec.next = w; }
    else if (hitAll && rpe<=8 && it.unit!=="sec"){
      if (e.w && w){ const inc = e.e.includes("barres")||e.e.includes("machines") ? 2.5 : (e.e.includes("poulies")?2.5:1); rec.next = Math.round((w+inc)*2)/2; rec.raised=true; notes.push(e.n+" : "+w+" → "+rec.next+" kg la prochaine fois."); }
      else if (!e.w) { rec.reps = reps+1; notes.push(e.n+" : vise "+(reps+1)+" répétitions la prochaine fois."); }
    } else if (rpe>=9 && e.w && w){ rec.next = w; }
    S.lastByEx[it.ex] = rec;
  });
  if (a.type==="MOB"||a.type==="STR") notes.push("Récupération enregistrée : elle compte autant que l'entraînement pour progresser.");
  if (pain) notes.unshift("Tu as signalé une douleur : aucune charge n'augmente. Si elle persiste, demande l'avis d'un professionnel de santé.");
  else if (rpe>=9) notes.unshift("Séance très difficile : je garde les mêmes charges pour la prochaine.");
  else if (!allDone) notes.unshift("Séance partielle : c'est enregistré, sans pénalité. On reprend au même niveau.");
  else if (!notes.length && a.type!=="MOB" && a.type!=="STR") notes.push("Je garde les charges actuelles : vise le haut de la fourchette de répétitions.");
  const lvlBefore = levelOf(totalXP());
  const log = {id:a.id, date:a.date, type:a.type, title:a.title, items:a.items.map(it=>({ex:it.ex, sets:it.sets})), duration: Math.max(1,Math.round((Date.now()-a.started)/60000)), completed: allDone || (anyDone && M.filter(it=>it.sets.some(s=>s.done)).length >= Math.ceil(M.length*0.6)), rpe, energy:a.energyEnd||a.energy, pain};
  S.logs.push(log);
  let xp = 0;
  if (anyDone){
    if (a.type==="MOB"||a.type==="STR") xp += award("mob-"+a.id, 40, "Récupération", true);
    else xp += award("s-"+a.id, log.completed?100:50, log.completed?"Séance terminée":"Séance partielle", true);
    xp += award("fb-"+a.id, 20, "Retour de séance", false);
  }
  xp += settleChallenges();
  const newBadges = checkBadges();
  const lvlAfter = levelOf(totalXP());
  S.active = null;
  view.result = {log, xp, notes, newBadges, levelUp: lvlAfter>lvlBefore ? lvlAfter : 0};
  save(true);
}

function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }

/* ---------- Événements ---------- */
document.addEventListener("click", ev=>{
  const stop = ev.target.closest("[data-stop]");
  const el = ev.target.closest("[data-act]"); if (!el) return;
  if (stop && el.dataset.act==="closesheet" && !el.closest(".panel")) {} // clic dans le panneau : ignoré
  if (el.classList.contains("sheet") && ev.target!==el) return;
  const act = el.dataset.act, v = el.dataset.v;
  const d = view.draft, a = S.active;
  switch(act){
    case "tuto": sheet={tuto:v}; renderLayer(); break;
    case "chrono": startChrono(+el.dataset.k); break;
    case "kgstep": { const it=a.items[a.step], k=+el.dataset.k, e=EX[it.ex]; const inc = e.e.includes("halteres") && !e.e.includes("machines") ? 1 : 2.5;
      const cur = parseFloat(it.sets[k].weight)||0; const nv = Math.max(0, Math.round((cur + inc*(+v))*2)/2);
      for (let j=k;j<it.sets.length;j++){ if (j===k || !it.sets[j].done){ it.sets[j].weight = nv; const o=$("#w"+j); if (o) o.value = nv; } if (j===k) continue; }
      save(); } break;
    case "breath": view.breath={id:v,start:0,done:false}; renderLayer(); break;
    case "breathgo": view.breath.start=Date.now(); renderLayer(); cancelAnimationFrame(breathRAF); breathTick(); break;
    case "breathstop": view.breath.start=0; cancelAnimationFrame(breathRAF); renderLayer(); break;
    case "breathclose": cancelAnimationFrame(breathRAF); view.breath=null; render(); break;
    case "tab": view.tab=v; window.scrollTo(0,0); render(); break;
    case "expand": view.expanded = view.expanded===+v ? null : +v; render(); break;
    case "obnext":
      if (view.ob===0){ obDraft(); view.ob=1; render(); break; }
      if (view.ob<OB_STEPS-1){ view.ob++; window.scrollTo(0,0); render(); break; }
      { const dd=obDraft(); if(!dd.zones.length) dd.zones=["global"]; const changed = !!S.profile; S.profile=dd; if(!S.program) S.program={start:dk(monday(new Date()))}; view.draft=null; view.ob=0; view.tab="accueil"; save(true); render(); if(changed) toast("Programme mis à jour"); }
      break;
    case "obback": if (view.ob<=1 && S.profile){ view.draft=null; view.ob=0; } else view.ob=Math.max(0,view.ob-1); render(); break;
    case "pick": { const dd=obDraft(), f=el.dataset.f, arr=dd[f]; const i=arr.indexOf(v); if(i>=0) arr.splice(i,1); else { if(f==="zones" && v==="global") arr.length=0; if(f==="zones" && v!=="global"){ const g=arr.indexOf("global"); if(g>=0) arr.splice(g,1);} arr.push(v);} render(); } break;
    case "level": obDraft().level=+v; render(); break;
    case "day": { const dd=obDraft(); const n=+v, i=dd.days.indexOf(n); if(i>=0) dd.days.splice(i,1); else if(dd.days.length<5) dd.days.push(n); else toast("5 jours maximum : la récupération compte aussi"); render(); } break;
    case "minutes": obDraft().minutes=+v; render(); break;
    case "allequip": obDraft().equipment = EQUIP.map(e=>e.id); render(); break;
    case "editprefs": view.draft = JSON.parse(JSON.stringify(S.profile)); view.ob=1; window.scrollTo(0,0); render(); break;
    case "start": startSession(v, el.dataset.o, el.dataset.mode); break;
    case "resume": openPlayer(); break;
    case "postpone": { S.postponed[todayKey()] = true; save(); const nd=nextPlannedDay(); render(); toast("Séance décalée"+(nd?" à "+DAYS_LONG[nd.getDay()]:"")+", sans pénalité"); } break;
    case "energy": a.energy = a.energy===v?null:v; if (v==="low" && !a.tiredApplied){ a.items.forEach(it=>{ if(it.sets.length>2 && !it.sets.some(s=>s.done)) it.sets.pop(); }); a.tiredApplied=true; } save(); renderLayer(); break;
    case "painstart": a.painStart = !a.painStart; save(); renderLayer(); break;
    case "go": { const n=+v; sheet=null; stopRest(); stopChrono(); a.step = clamp(n,-1,a.items.length); save(); renderLayer(); const p=$(".player"); if(p) p.scrollTop=0; } break;
    case "done": { const it=a.items[a.step], k=+el.dataset.k, s=it.sets[k]; s.done=!s.done; save(); renderLayer(); const remaining = it.sets.some(x=>!x.done); if (s.done && remaining && it.rest) startRest(it.rest); } break;
    case "restadd": if (view.player.rest){ view.player.rest.end += 15000; view.player.rest.total += 15; } break;
    case "restskip": stopRest(); renderLayer(); break;
    case "swap": sheet="swap"; view.keepSwap=false; renderLayer(); break;
    case "keepswap": view.keepSwap=!view.keepSwap; el.setAttribute("aria-checked", view.keepSwap); break;
    case "doswap": { const it=a.items[a.step], e=EX[v]; if (view.keepSwap) S.swaps[EX[it.ex].g]=v; const last=S.lastByEx[v]; it.ex=v; it.sets.forEach(s=>{ if(!s.done){ s.weight = e.w ? (last&&last.next!=null?last.next:"") : ""; } }); sheet=null; save(); renderLayer(); toast("Exercice remplacé"); } break;
    case "pause": sheet="pause"; renderLayer(); break;
    case "tohome": sheet=null; stopChrono(); closePlayer(); break;
    case "abandon": S.active=null; sheet=null; stopChrono(); save(); closePlayer(); break;
    case "energyEnd": a.energyEnd=v; save(); renderLayer(); break;

    case "closesheet": sheet=null; renderLayer(); break;
    case "toggle": S.settings[v] = !S.settings[v]; save(); render(); break;
    case "theme": S.settings.theme=v; save(); render(); break;
    case "export": sheet="export"; renderLayer(); break;
    case "copy": { const t=$("#exp"); const txt=t.value; const ok=()=>toast("Copié"); try{ navigator.clipboard.writeText(txt).then(ok).catch(()=>{ t.select(); toast("Sélectionné : copie-le avec le menu"); }); }catch(e){ t.select(); } } break;
    case "import": sheet="import"; renderLayer(); break;
    case "doimport": try{ const o=JSON.parse($("#imp").value); if(!o || typeof o!=="object" || !("logs" in o)) throw 0; S=Object.assign(blank(),o); sheet=null; save(true); render(); toast("Données importées"); }catch(e){ toast("Ce texte n'est pas une sauvegarde CORY valide"); } break;
    case "wipe": sheet="wipe"; renderLayer(); break;
    case "dowipe": S=blank(); sheet=null; view.tab="accueil"; view.ob=0; view.draft=null; save(true); render(); break;
  }
});
document.addEventListener("input", ev=>{
  const el = ev.target;
  if (el.dataset.f && !el.dataset.act && view.draft){ obDraft()[el.dataset.f] = el.value; return; }
  if (el.dataset.act==="setval" && S.active){ const it=S.active.items[S.active.step], k=+el.dataset.k, f=el.dataset.f; it.sets[k][f] = el.value;
    if (f==="weight") for (let j=k+1;j<it.sets.length;j++){ if (!it.sets[j].done){ it.sets[j].weight = el.value; const o=$("#w"+j); if (o) o.value = el.value; } }
    save(); }
  if (el.dataset.act==="rpe" && S.active){ S.active.rpe=+el.value; const o=$("#rpev"); if(o) o.textContent=el.value; save(); }
});

render();
(function splash(){ const sp = $("#splash"); if (!sp) return; sp.innerHTML = LOGO + '<div class="w">CORY</div><p class="muted">Le coaching à ton rythme.</p>';
  const reduce = S.settings.reduce || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  setTimeout(()=>{ sp.classList.add("out"); setTimeout(()=>sp.remove(), 500); }, reduce ? 500 : 1300); })();
setInterval(()=>{ if (S.settings.reduce) return; document.querySelectorAll("img[data-faces]").forEach(img=>{ const f = img.dataset.faces.split(","); if (f.length<2) return; const i = (+(img.dataset.i||0)+1) % f.length; img.classList.add("fade"); setTimeout(()=>{ img.src = "img/"+f[i]+".webp"; img.alt = "CORY, "+(FACE_LABEL[f[i]]||""); img.dataset.i = i; img.classList.remove("fade"); }, 350); }); }, 6000);
setTimeout(initRemote, 0);
if (S.active && !view.player) {} // la séance en pause s'affiche sur l'accueil
})();
</script>
